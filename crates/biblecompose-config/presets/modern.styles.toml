# The modern edition's look: the "Modern side-heads" design.
#
# A serif text, Source Serif 4, with everything that orders it — the book's
# name, the headings, the numbers, the head and the foot — in a sans, Inter.
# One accent, a deep blue, on the headings and the numbers; the rest is ink
# and a cool grey.

# The book's name large and heavy in the sans, set tight, flush left.
[book]
font_family = "Inter"
font_size = "55pt"
weight = 800
letter_spacing = "-1.9pt"
align = "start"
space_below = "18pt"

# "The Gospel According to" beside it, in the side column: small spaced
# capitals in the sans, in grey.
[book_lead]
font_family = "Inter"
font_size = "7.1pt"
weight = 600
uppercase = true
letter_spacing = "0.7pt"
color = "#5e6670"

# The figure dropped three lines in the sans, heavy, in the blue.
[chapter]
font_family = "Inter"
weight = 800
color = "#1e4d7a"
gap_after = "9pt"

# The side-heads: small, semibold, in the blue, right-aligned against the
# text; the passage they cover under them in grey.
[heading.s1]
font_family = "Inter"
font_size = "7.7pt"
weight = 600
color = "#1e4d7a"

[heading.s2]
font_family = "Inter"
font_size = "7.4pt"
weight = 600
color = "#1e4d7a"

[heading.r1]
font_family = "Inter"
font_size = "7.1pt"
weight = 500
italic = false
color = "#5e6670"
gap_before = "2pt"

[heading.sr1]
font_family = "Inter"
font_size = "7.1pt"
weight = 500
italic = false
color = "#5e6670"
gap_before = "2pt"

# The verse numbers in the sans, bold and blue, raised.
[verse]
font_family = "Inter"
font_size = "6pt"
weight = 700
raise = "3pt"
color = "#1e4d7a"

# The head in spaced sans capitals; the foot in the sans, in grey.
[head]
font_family = "Inter"
font_size = "7.1pt"
weight = 600
italic = false
smallcaps = false
uppercase = true
letter_spacing = "0.6pt"

[folio]
font_family = "Inter"
font_size = "7.1pt"
weight = 500
color = "#5e6670"

# Paragraphs open flush and stand apart by a little space, as a modern book
# sets them.
[paragraph.p]
first_line_indent = "0pt"
space_above = "6.5pt"
