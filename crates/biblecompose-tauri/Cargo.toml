[package]
name = "biblecompose-tauri"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The desktop shell: window, dialogs, file I/O, and the command bridge."

# The shell owns no domain logic. It is a bridge — every command here is a thin
# translation between a frontend request and `biblecompose-app` (ARCHITECTURE
# section 2), which is why this crate may depend on the app and nothing below it.
# Two targets: a library the shell logic lives in, and a thin binary. The
# split is what lets the commands be unit-tested without starting a window.
[lib]
name = "biblecompose_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# The last link in ADR-006's chain. The shipped desktop application carries its
# own typesetter; a dev build does not, so this is off by default and
# `scripts/release.mjs` turns it on. Without it the window is a shell that
# expects to find SILE on the machine, which is the right thing for a
# developer and the wrong thing for a publisher.
embedded-sile = ["biblecompose-app/embedded-sile"]

[dependencies]
biblecompose-scripture.workspace = true
biblecompose-app.workspace = true
biblecompose-config.workspace = true
biblecompose-diagnostics.workspace = true
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"

# The editor a book opens in (ADR-007): easy-usfm's shell, in this process.
# Not a program this application starts but a plugin it registers, so there
# is one binary, nothing to unpack, and nothing to close but a window. The
# plugin's update check stays compiled out — its `updater` feature is not
# asked for — because the editor is part of this application and is updated
# with it, by the one check a person clicks for (ADR-008).
tauri-plugin-easy-usfm.workspace = true
# A link inside a document is handed to the operating system and never opened
# in the editor's webview (easy-usfm SECURITY 2), and that is this plugin.
tauri-plugin-opener = "2.5.4"

# The only HTTP client in the workspace, and it is here rather than in the app
# crate on purpose: the shell is the layer that already owns privileged I/O,
# and keeping egress out of `biblecompose-app` is what lets the build path and
# the command-line tool be free of network code by construction rather than by
# intention (ARCHITECTURE section 7.6, NFR-004). Pure Rust TLS, so a release
# does not pick up whatever OpenSSL the build machine had.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Checking for, and installing, a newer release (ADR-008) — the second request
# this application can make, and like the first only when somebody clicks for
# it. Its client is the framework's own `reqwest`, which the shell reached
# already, so this adds a reason to use it rather than a new way out. Reached
# from `update.rs` alone, which pins the one address asked and refuses a
# download from anywhere but this project's releases.
tauri-plugin-updater = "2.12.0"

# The preview (GUI-008): pages of the built PDF drawn into the window. hayro
# because it is pure Rust and forbids `unsafe`, so the renderer travels inside
# the one binary ADR-006 promises rather than as a native library per platform;
# a trial against PDFium found the two equally fast and equally faithful on
# Latin, Tamil, Arabic and Hebrew output (ADR-003, revision 3). Default
# features off: they bundle fallback faces for the standard fourteen fonts,
# and SILE embeds every face it sets.
hayro = { version = "0.9", default-features = false }
# What a drawn page reaches the webview as. Already in the tree under hayro.
png = "0.18"

[dev-dependencies]
biblecompose-testkit.workspace = true
tempfile.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
