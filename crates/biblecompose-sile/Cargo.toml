[package]
name = "biblecompose-sile"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The SILE backend: XML emission, process invocation, log mapping."

# ADR-004: this is the only crate that has heard of SILE, and nothing but
# biblecompose-app may depend on it. Enforced by tests/architecture.rs in
# biblecompose-testkit.
[features]
# ADR-006 option C: carry SILE inside the executable and unpack it once.
# Off by default — a plain `cargo build` should not need a 78 MB runtime to
# hand to rust-embed. Release builds turn it on and set
# BIBLECOMPOSE_SILE_BUNDLE; see src/bundle.rs.
embedded-sile = ["dep:rust-embed"]

[dependencies]
biblecompose-diagnostics.workspace = true
biblecompose-scripture.workspace = true
camino.workspace = true
quick-xml.workspace = true
# The chapter's opening initial is one *grapheme cluster*, not one `char`: a
# Tamil syllable is a consonant and a vowel sign, and a Devanagari conjunct is
# consonant, virama, consonant. The class cannot split those, so the emitter
# does, and says which run is the initial.
unicode-segmentation.workspace = true
# interpolate-folder-path: `#[folder = "$BIBLECOMPOSE_SILE_BUNDLE"]` is not
#   expanded without it. debug-embed: otherwise a debug build reads the bundle
#   off disk at run time, which is the opposite of what this feature is for.
rust-embed = { version = "8", optional = true, features = [
    "interpolate-folder-path",
    "debug-embed",
] }
serde.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # CreateJobObjectW takes a SECURITY_ATTRIBUTES pointer, and windows-sys
    # only emits a function when every type in its signature is enabled.
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
biblecompose-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
