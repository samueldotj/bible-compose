# BibleCompose built-in settings (CFG-001).
#
# Every value a build uses is here. A project's biblecompose.toml overrides
# these field by field (CFG-002), so a file that sets only `page.width` leaves
# everything else exactly as written below.
#
# This is a real TOML file compiled into the application rather than a table of
# Rust constants, which buys three things: it is read by the same code that
# reads a project file, so a default that would be rejected from a project fails
# our own test suite; it is what "reset to default" shows the publisher
# (CFG-007); and it is documentation of every key that exists.

schema_version = 1

# CFG-004: a key this release does not recognise is a warning. Turn this on to
# make it stop the build instead — worth doing in a publishing pipeline, where
# a silently ignored setting is a book printed wrong.
strict = false

[project]
# `name` is deliberately absent. There is no default publication name that is
# right for anybody, so an unset name means "use the project folder's name".
language = "en"

[books]
# Empty means canonical order throughout, and every discovered book included.
# `include` is absent rather than empty, because `include = []` is a project
# that has deliberately selected nothing — a different thing, and one the
# application reports rather than silently treats as "everything".
order = []

[page]
size = "6x9in"
columns = 2

# Absolute rather than percentages of the page. The SILE class falls back to
# percentages when no option is given, so it works at any size on its own, but a
# relative margin cannot be range-checked or shown in a form without resolving
# it first. These are the percentage defaults evaluated at 6x9in, so the page
# these produce is the page the class produced before there was a settings
# layer.
margin_top = "0.81in"    # was 9%ph
margin_bottom = "1.08in" # was 12%ph
margin_inner = "0.66in"  # was 11%pw
margin_outer = "0.48in"  # was 8%pw
column_gap = "0.21in"    # was 3.5%pw
header_gap = "0.36in"    # was 4%ph
footer_gap = "0.27in"    # was 3%ph

[typography]
font_family = "DejaVu Serif"
font_size = "9.2pt"

# Leading is an absolute length, not a multiple of the body size. Both are ways
# of saying one thing, and holding both means reconciling them; a form that
# wants to offer "1.2×" can multiply and write the length.
leading = "11.2pt"

justify = true
keep_poetry_indentation = true
hyphenation = true

# Which parts of a book are printed. Everything is in the document either way;
# these decide what reaches the page (ADR-002).
[contents]
show_book_introductions = true
show_introductory_outlines = true
show_section_headings = true

[numbering]
show_chapter_numbers = true
show_verse_numbers = true
# Verse 1 goes unnumbered where the chapter number already marks the place.
# Off by default: it is a common Bible convention rather than a universal one.
hide_first_verse_number = false

# USFM's `\cl` — the words a translation gives a chapter, such as
# `\cl அத்தியாயம் 1` beside `\c 1`. On, because a translation that carries them
# wrote them deliberately; off for an edition that wants the figure alone.
show_chapter_labels = true

[notes]
show_footnotes = true
show_cross_references = true

# What USFM's `\f +` asks for: the next mark in a sequence. `numbers`,
# `letters`, `symbols`, or `none`. A note that names its own caller — `\f *` —
# keeps it, and does not take a place in the sequence.
#
# Different sequences for the two kinds, so a page carrying both says which
# mark belongs to which without a legend.
footnote_callers = "numbers"
cross_reference_callers = "letters"

# Where a sequence starts again: `per_chapter`, `per_book` or `never`.
# Per chapter, because that is the common Bible convention and because it keeps
# the marks short — a book-long sequence of footnotes reaches three digits.
restart_numbering = "per_chapter"

# Where a `\x` reference is set: `note_area` beside the footnotes, `inline` in
# brackets where it was called, or `end_of_paragraph` gathered under the
# paragraph that called it (SCR-005). Centre-column is post-MVP.
cross_reference_placement = "note_area"

# Three slots at the top of the page and three at the foot, each holding one
# of: empty, page_number, reference_range, first_reference, last_reference,
# book_name, alt_book_name.
#
# The arrangement below is the one this application had when the same thing was
# four switches — the book on the left of the head, the range on the right, the
# page number centred at the foot — so a project that never touches these gets
# the page it always got.
[headers]
header_left = "book_name"
header_center = "empty"
header_right = "reference_range"
footer_left = "empty"
footer_center = "page_number"
footer_right = "empty"

# Figures and anything else a project points at that is not Scripture.
[assets]
# What to do about a figure whose file is not there: `stop` refuses to build,
# `omit` leaves it out and warns. Stop, because a printed book with a hole
# where an illustration should be is worse than a build that says why — and
# because the backend will happily produce that book without mentioning it.
#
# A figure pointing outside the project folder is refused whatever this says,
# and so is one in a format the backend cannot read.
missing_figure = "stop"

[output]
keep_intermediates = false
