# A journaling Bible.
#
# One column of text and a two-inch outer margin left empty for the reader's
# own hand. The margin is the feature: it is on the outer edge of every page,
# where a pen can reach it with the book open flat, and the text block moves
# in to make room rather than the type getting smaller to keep its measure.
#
# No cross-references and no footnotes at the foot — the margin is for what
# the reader writes, and an apparatus competing with it is the wrong thing
# on this page. Verse numbers stay, so a note in the margin has something to
# be beside.

[page]
size = "6.5x9in"
columns = 1
margin_inner = "0.7in"
margin_outer = "2in"
margin_top = "0.8in"
margin_bottom = "0.9in"

[typography]
font_size = "9pt"
leading = "12pt"
justify = true

# A dropped first letter opens each chapter; its number stands on the line
# above it, in the accent `journaling.styles.toml` gives it.
[contents]
drop_caps = true
drop_cap_of = "first_letter"
drop_cap_lines = 3

[numbering]
show_chapter_numbers = true
show_verse_numbers = true
hide_first_verse_number = true

[notes]
show_footnotes = false
show_cross_references = false

# Page and range together at the outer corner, where the wide margin is, so
# the head sits over the space the reader writes in and the inner side of the
# page stays quiet.
[headers.left_page]
header_left = "{Page}  ·  {Range}"
header_center = ""
header_right = ""
footer_center = ""
[headers.right_page]
header_left = ""
header_center = ""
header_right = "{Range}  ·  {Page}"
footer_center = ""
