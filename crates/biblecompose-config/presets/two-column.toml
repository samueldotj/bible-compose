# The conventional Bible page, written out (P6.2).
#
# Nearly the built-in defaults, and that is the point of shipping it as a
# preset rather than leaving it implicit: a publisher who starts from "standard
# two-column" and then changes three things has a settings file that says what
# their edition is, rather than one that says what they disagreed with. It also
# gives the other two presets something to be a departure *from*.
#
# What it does add over the defaults is the two lines nobody would think to
# write and everybody wants: the first verse of a chapter goes unnumbered,
# because the chapter figure beside it already says which verse it is. And
# the classic page's furniture — the figure dropped into the text, the head
# indexing the page — with its look in `two-column.styles.toml`.

[page]
size = "6x9in"
columns = 2
column_gap = "18pt"
# The classic page's rules, each in its own weight and ink: a firm dark one
# under the head, and light warm-grey ones over the foot and down the gutter,
# so the eye reads past the two that run beside the text.
header_gap = "24pt"
header_rule = "0.6pt"
header_rule_color = "#1c1a17"
header_rule_gap = "11pt"
footer_gap = "14pt"
footer_rule = "0.6pt"
footer_rule_color = "#cfc6b5"
footer_rule_gap = "6pt"
column_rule = "0.6pt"
column_rule_color = "#cfc6b5"

# EB Garamond, which the application ships, at the design's density: its
# line spacing measured against the page, not the column.
[typography]
font_family = "EB Garamond"
font_size = "9.2pt"
leading = "12.2pt"
justify = true

# The chapter figure dropped two lines into the text, as the classic page
# sets it, rather than standing at the start of the line with the text
# running on after it. Its colour is in `two-column.styles.toml`.
[contents]
drop_caps = true
drop_cap_of = "chapter_number"
drop_cap_lines = 2
title_ornament = "diamond"
title_ornament_color = "#7a1f1f"
ornament_rule_color = "#1c1a17"

[numbering]
show_chapter_numbers = true
show_verse_numbers = true
hide_first_verse_number = true

[notes]
show_footnotes = true
show_cross_references = true
cross_reference_placement = "note_area"

# The classic head: the page's first reference at the left, its last at the
# right and the page number between them; the foot names the book it is.
[headers.left_page]
header_left = "{Book} {FirstReference}"
header_center = "{Page}"
header_right = "{Book} {LastReference}"
footer_center = "the holy bible"
[headers.right_page]
header_left = "{Book} {FirstReference}"
header_center = "{Page}"
header_right = "{Book} {LastReference}"
footer_center = "the holy bible"
