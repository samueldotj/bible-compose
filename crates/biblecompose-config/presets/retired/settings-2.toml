# Values an edition used to set and no edition sets now, written by
# scripts/retired-presets.py. Applying an edition clears these too.

[headers]
header_center = "book_name"
header_left = "first_reference"
header_right = "empty"

[headers.left_page]
header_center = "empty"
header_left = "book_name"
header_right = "empty"

[headers.right_page]
header_center = "empty"
header_left = "{FirstReference}"
header_right = "reference_range"

[page]
column_rule = "0.4pt"
column_rule_color = "#2e5e4e"
footer_rule = "1pt"
footer_rule_color = "#2e5e4e"
frame_width = "0.7pt"
header_rule = "1.2pt"
header_rule_color = "#2e5e4e"
margin_inner = "0.7in"
rule_color = "#b9c0c8"

[typography]
leading = "12pt"
