name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The three platforms NFR-001 names. The backend is absent here, so the
  # integration tests in biblecompose-sile/tests/backend.rs skip themselves
  # with a message; everything else runs, which is the point of the Backend
  # trait — the whole pipeline above it is testable with no typesetter.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  # DET-001 says the generated input is byte-identical "across runs, machines
  # and operating systems". The golden files are committed with LF endings, so
  # a Windows checkout that converted them would fail here — which is exactly
  # the platform-specific determinism bug worth catching.
  determinism:
    name: golden files are identical on every platform
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: golden files match
        run: cargo test -p biblecompose-sile --test golden
      - name: and are unchanged after a regeneration
        shell: bash
        run: |
          UPDATE_GOLDEN=1 cargo test -p biblecompose-sile --test golden
          if ! git diff --quiet -- tests/golden; then
            echo "::error::Regenerating the golden files changed them on ${{ matrix.os }}."
            echo "That means emission is not deterministic across platforms (DET-001)."
            git --no-pager diff -- tests/golden
            exit 1
          fi

  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ADR-004's boundary and SILE-005's ordered-map rule. Both are the kind that
  # erode one convenient import at a time, so they are asserted rather than
  # reviewed. Broken out as its own job so a failure names itself in the UI.
  architecture:
    name: architectural rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p biblecompose-testkit --test architecture -- --nocapture

  # The end-to-end acceptance for M0: a fixture becomes a PDF through the real
  # emitter, the real class and the real process invocation. Linux only for
  # now — spike F-1 established there is no prebuilt SILE for Windows or macOS,
  # and building it for those is P5.7.
  backend:
    name: end-to-end with a real SILE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: install SILE and its Lua rocks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.1 liblua5.1-0-dev luarocks libexpat1-dev zlib1g-dev libssl-dev \
            libharfbuzz0b libfontconfig1 libicu-dev
          bash spike/setup-wsl.sh

      - name: typeset every fixture
        env:
          SILE_PATH: ${{ github.workspace }}/sile
        run: |
          source ~/.local/bin/sile-env
          cargo test -p biblecompose-sile --test backend -- --nocapture

      - name: the CLI produces a PDF
        env:
          SILE_PATH: ${{ github.workspace }}/sile
        run: |
          source ~/.local/bin/sile-env
          cargo run -p biblecompose-cli -- build \
            --fixture john_1_1_5 --output /tmp/ci.pdf --sile-path "$SILE_PATH"
          test -s /tmp/ci.pdf
