# A reference edition, notes at the foot.
#
# Made for finding a passage rather than for reading one through: two columns
# of small type on a hand-sized page, every verse numbered and on a line of
# its own, and the running head giving the first and last reference on the
# page — the two things a reader flipping to Isaiah 53 is looking for. The
# cross-references and footnotes stay, at the foot, because they are what a
# reference edition is for. Its sibling, "Reference, centre column", sets
# them down the middle of the page instead.
#
# Measured off the "Reference Bible" design, whose 14px body is 8.5pt here: a
# pixel of it is about 0.6pt.

[page]
size = "5.5x8.5in"
columns = 2
margin_inner = "0.6in"
margin_outer = "0.45in"
margin_top = "0.65in"
margin_bottom = "0.7in"
column_gap = "0.2in"
# A heavy rule under the head, as a reference Bible's, a light one over the
# notes, and one between the columns.
header_rule = "thick"
header_rule_color = "#1b1a17"
footer_rule = "thin"
footer_rule_color = "#1b1a17"
column_rule = "thin"
column_rule_color = "#b9b2a6"

[typography]
font_family = "Libre Caslon Text"
font_size = "8.5pt"
leading = "12.4pt"
justify = true

# Each chapter opens in a band: its figure, large, between two rules, the
# section heading under it in the italic of the design's chapter summary.
# Every verse starts a line, indented, as the old reference Bibles set them.
[contents]
show_section_headings = true
drop_caps = false
chapter_ornament = "band"
ornament_rule_color = "#1b1a17"
verse_starts = "next_line"

[numbering]
show_chapter_numbers = true
show_verse_numbers = true
hide_first_verse_number = false

[notes]
show_footnotes = true
show_cross_references = true
cross_reference_placement = "note_area"
cross_reference_callers = "letters"
restart_numbering = "per_chapter"

# First reference at the left, last at the right, the page number between:
# the head is an index of the page, and the foot is left to the notes.
[headers.left_page]
header_left = "{Book} {FirstReference}"
header_center = "{Page}"
header_right = "{Book} {LastReference}"
footer_left = "Reference Edition"
footer_center = ""
footer_right = "Words of Christ in red"
[headers.right_page]
header_left = "{Book} {FirstReference}"
header_center = "{Page}"
header_right = "{Book} {LastReference}"
footer_left = "Reference Edition"
footer_center = ""
footer_right = "Words of Christ in red"

# Every verse can be linked into, which is the reference edition's other use.
[output]
anchors = "verse"
