# A study Bible: the "Study Bible" design.
#
# Everything on: introductions, outlines, section headings, footnotes and
# cross-references. A larger page — 7x10in, the common study trim — because
# the apparatus takes room at the foot and the text is not what should give
# it up. One column of text, as the design sets it, so each passage reads
# whole above the notes that open it up.
#
# Measured off the design, whose 15.5px body is 9.5pt here: a pixel of it is
# about 0.61pt.

[page]
size = "7x10in"
columns = 1
margin_inner = "0.75in"
margin_outer = "0.65in"
margin_top = "0.8in"
margin_bottom = "1in"
# A firm rule under the head, a light one over the foot.
header_rule = "0.6pt"
header_rule_color = "#1a1c1b"
header_rule_gap = "13pt"
footer_rule = "0.6pt"
footer_rule_color = "#c9d3ce"
footer_rule_gap = "6pt"

[typography]
font_family = "Literata"
font_size = "9.5pt"
leading = "14.7pt"
justify = true
# The design is a web page, where Literata is drawn in the cut for its
# 15.5px: finer than the cut for 9.5pt, and the one the page should match.
optical_size = 1.6

[contents]
show_book_introductions = true
show_introductory_outlines = true
show_section_headings = true
drop_caps = true
drop_cap_of = "chapter_number"
drop_cap_lines = 2

[numbering]
show_chapter_numbers = true
show_verse_numbers = true
hide_first_verse_number = true

[notes]
show_footnotes = true
show_cross_references = true
cross_reference_placement = "note_area"
footnote_callers = "numbers"
cross_reference_callers = "letters"
restart_numbering = "per_chapter"
# The study notes after each passage, in two columns under a fine green
# rule and their label.
study_notes_label = "Study notes"
study_notes_columns = 2
study_notes_rule = "0.6pt"

# The book and passage at the head's left, the page at its right; the
# edition and the chapter at the foot.
[headers.left_page]
header_left = "{Book} {Range}"
header_center = ""
header_right = "{Page}"
footer_left = "Study Edition"
footer_center = ""
footer_right = "{Book} {FirstChapter}"
[headers.right_page]
header_left = "{Book} {Range}"
header_center = ""
header_right = "{Page}"
footer_left = "Study Edition"
footer_center = ""
footer_right = "{Book} {FirstChapter}"

[output]
anchors = "verse"
