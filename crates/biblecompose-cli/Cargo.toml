[package]
name = "biblecompose-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless build — the test harness and the primary development tool."

[[bin]]
name = "biblecompose"
path = "src/main.rs"

# No GUI crate is linked here, which is how NFR-009 is satisfied structurally
# rather than by discipline.
[features]
# Pass-through for ADR-006 option C. Declared here so a release
# build turns it on once, at the top, rather than crate by crate.
embedded-sile = ["biblecompose-app/embedded-sile"]

[dependencies]
biblecompose-app.workspace = true
biblecompose-config.workspace = true
biblecompose-diagnostics.workspace = true
biblecompose-scripture.workspace = true
biblecompose-testkit.workspace = true
camino.workspace = true
clap.workspace = true
serde_json.workspace = true

[lints]
workspace = true
