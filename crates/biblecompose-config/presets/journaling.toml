# A journaling Bible: the "Journaling margin" design.
#
# One column of text and a two-inch outer margin ruled for the reader's own
# hand. The margin is the feature: it is on the outer edge of every page,
# where a pen can reach it with the book open flat, and the text block moves
# in to make room rather than the type getting smaller to keep its measure.
#
# No cross-references and no footnotes at the foot — the margin is for what
# the reader writes, and an apparatus competing with it is the wrong thing
# on this page. Verse numbers stay, so a note in the margin has something to
# be beside.
#
# Measured off the design, whose 16px body is 9.6pt here: a pixel of it is
# 0.6pt.

[page]
size = "6.5x9in"
columns = 1
margin_inner = "0.6in"
margin_outer = "2in"
margin_top = "0.8in"
margin_bottom = "0.85in"
# The margin ruled for writing in, 28px apart, in a warm grey a pen writes
# over.
note_lines = true
note_line_spacing = "16.8pt"
rule_color = "#d8cfbf"

[typography]
font_family = "Crimson Pro"
font_size = "9.6pt"
leading = "14.9pt"
justify = false

# A dropped first letter opens each chapter, under a small spaced label —
# "CHAPTER 12" — in the accent `journaling.styles.toml` gives it.
[contents]
drop_caps = true
drop_cap_of = "first_letter"
drop_cap_lines = 3

[numbering]
show_chapter_numbers = true
show_verse_numbers = true
hide_first_verse_number = true
chapter_caption = "Chapter"
psalm_caption = "Psalm"

[notes]
show_footnotes = false
show_cross_references = false

# The passage and the page together at the outer corner, over the margin the
# reader writes in; the edition's name at the foot.
[headers.left_page]
header_left = "{Page}   |   {Book} {Range}"
header_center = ""
header_right = ""
footer_left = ""
footer_center = ""
footer_right = "Journaling Edition"
[headers.right_page]
header_left = ""
header_center = ""
header_right = "{Book} {Range}   |   {Page}"
footer_left = ""
footer_center = ""
footer_right = "Journaling Edition"
