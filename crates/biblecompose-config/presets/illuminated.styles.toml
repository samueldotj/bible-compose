# The illuminated edition's look: the "Illuminated" design.
#
# Rubrication, in EB Garamond with Cinzel's inscriptional capitals for
# everything that orders the text: red for the head, the headings, the verse
# numbers and the page number; the chapter's number in Roman capitals in the
# text's own ink, with gold and red under it; and the first letter of each
# chapter in cream on a block of red.

[book]
font_family = "Cinzel"
font_size = "20pt"
weight = 400
letter_spacing = "3.6pt"
color = "#9e2a1f"
space_below = "10pt"

# "CHAPTER II": caption and number on one line, in Cinzel, spaced.
[chapter_caption]
font_family = "Cinzel"
font_size = "26.7pt"
weight = 400
uppercase = true
letter_spacing = "4.8pt"
gap_after = "8pt"

[chapter]
font_family = "Cinzel"
font_size = "26.7pt"
weight = 400
letter_spacing = "4.8pt"
own_line = true
align = "center"
space_above = "14pt"
space_below = "12pt"

[heading.s1]
font_family = "Cinzel"
font_size = "8.7pt"
weight = 600
uppercase = true
letter_spacing = "1.9pt"
align = "center"
color = "#9e2a1f"
space_above = "8pt"
space_below = "6pt"

[heading.s2]
font_family = "Cinzel"
font_size = "8.2pt"
weight = 600
uppercase = true
letter_spacing = "1.6pt"
align = "center"
color = "#9e2a1f"
space_above = "6pt"
space_below = "4pt"

[heading.d1]
align = "center"
italic = true

[verse]
font_family = "Cinzel"
font_size = "6.6pt"
weight = 700
color = "#9e2a1f"

# The head in spaced red capitals, the page number in red.
[head]
font_family = "Cinzel"
font_size = "8pt"
weight = 600
italic = false
smallcaps = false
uppercase = true
letter_spacing = "2.6pt"
color = "#9e2a1f"

[folio]
font_family = "Cinzel"
font_size = "8.7pt"
letter_spacing = "1pt"
color = "#9e2a1f"

# Paragraphs open flush and stand a little apart, as the design sets them.
[paragraph.p]
first_line_indent = "0pt"
space_above = "6pt"

# The initial in cream on a block of red.
[initial]
font_family = "Cinzel"
weight = 700
color = "#f6efdf"
background = "#9e2a1f"
