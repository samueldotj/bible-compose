# The reference edition's look: the "Reference Bible" design.
#
# Dense and black, in Libre Caslon, with one exception: the words of Christ
# in red. A red-letter edition is a reference convention as much as a
# devotional one — it lets a reader find a saying at a glance. Everything
# else is told apart by weight: bold verse numbers set on the line, a large
# light chapter figure in its band, and the head in Libre Franklin's spaced
# capitals. A pixel of the design is about 0.6pt.

[character.wj]
color = "#a12a22"

# The figure on a line of its own at the band's left, as large as the
# design's mid-column opening (56px), between rules of its 1px.
[chapter]
font_size = "32pt"
weight = 400
own_line = true
align = "start"
border_width = "0.6pt"
space_above = "6pt"
space_below = "4pt"

# Verse numbers bold, at the text's height, a little smaller than it; each
# verse's line indented as the design's paragraphs are (12px).
[verse]
font_size = "7pt"
weight = 700
raise = "0pt"
first_line_indent = "7.3pt"

# The cross-reference letters small, italic and grey.
[reference]
font_size = "6.5pt"
italic = true
color = "#55504a"

# The note's verse, bold, as the design keys its notes.
[character.fr]
weight = 700
[character.xo]
weight = 700
italic = false
color = "#1b1a17"

# The section heading in the place and the italic of the design's chapter
# summary: left, in the text's weight, a shade lighter than the text.
[heading.s1]
font_size = "7.9pt"
weight = 400
italic = true
smallcaps = false
align = "start"
color = "#3b3833"
space_above = "6pt"
space_below = "3pt"

[head]
font_family = "Libre Franklin"
font_size = "6.7pt"
weight = 600
italic = false
smallcaps = false
uppercase = true
letter_spacing = "0.8pt"

[folio]
font_family = "Libre Franklin"
font_size = "6.4pt"
weight = 500
uppercase = true
letter_spacing = "0.64pt"
color = "#55504a"

[paragraph.p]
first_line_indent = "7.3pt"
