[package]
name = "biblecompose-tauri"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The desktop shell: window, dialogs, file I/O, and the command bridge."

# The shell owns no domain logic. It is a bridge — every command here is a thin
# translation between a frontend request and `biblecompose-app` (ARCHITECTURE
# section 2), which is why this crate may depend on the app and nothing below it.
# Two targets: a library the shell logic lives in, and a thin binary. The
# split is what lets the commands be unit-tested without starting a window.
[lib]
name = "biblecompose_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# The last link in ADR-006's chain. The shipped desktop application carries its
# own typesetter; a dev build does not, so this is off by default and
# `scripts/release.mjs` turns it on. Without it the window is a shell that
# expects to find SILE on the machine, which is the right thing for a
# developer and the wrong thing for a publisher.
embedded-sile = ["biblecompose-app/embedded-sile"]

[dependencies]
biblecompose-scripture.workspace = true
biblecompose-app.workspace = true
biblecompose-config.workspace = true
biblecompose-diagnostics.workspace = true
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"

# The only HTTP client in the workspace, and it is here rather than in the app
# crate on purpose: the shell is the layer that already owns privileged I/O,
# and keeping egress out of `biblecompose-app` is what lets the build path and
# the command-line tool be free of network code by construction rather than by
# intention (ARCHITECTURE section 7.6, NFR-004). Pure Rust TLS, so a release
# does not pick up whatever OpenSSL the build machine had.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
biblecompose-testkit.workspace = true
tempfile.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
