# The reference edition's look: the "Reference Bible" design.
#
# Dense and black, in Libre Caslon, with one exception: the words of Christ
# in red. A red-letter edition is a reference convention as much as a
# devotional one — it lets a reader find a saying at a glance. Everything
# else is told apart by weight: bold verse numbers set on the line, a large
# light chapter figure, and the head in Libre Franklin's spaced capitals.

[character.wj]
color = "#a12a22"

[chapter]
font_size = "24pt"
weight = 400
gap_after = "6pt"

# Verse numbers bold, at the text's height, a little smaller than it.
[verse]
font_size = "7pt"
weight = 700
raise = "0pt"

# The cross-reference letters small, italic and grey.
[reference]
font_size = "6.5pt"
italic = true
color = "#55504a"

[heading.s1]
font_size = "8.6pt"
weight = 600
smallcaps = true
align = "center"
space_above = "6pt"
space_below = "2pt"

[head]
font_family = "Libre Franklin"
font_size = "6.7pt"
weight = 600
italic = false
smallcaps = false
uppercase = true
letter_spacing = "0.8pt"

[folio]
font_family = "Libre Franklin"
font_size = "6.4pt"
weight = 500
uppercase = true
letter_spacing = "0.64pt"
color = "#55504a"

[paragraph.p]
first_line_indent = "7.3pt"
